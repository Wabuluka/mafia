name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # @mafia/shared ships raw TS; build it first so typecheck/build of the
      # apps can resolve its compiled dist/ (mirrors root `npm run build`).
      - run: npm run build -w packages/shared

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w apps/server
      - run: npm run build -w apps/web
        env:
          # The real deploy bakes API_ORIGIN=http://127.0.0.1:4000 into the
          # image (repo-root Dockerfile) since Next proxies /api and
          # /socket.io to the co-located server. A dummy here just lets
          # `next build` succeed in CI.
          API_ORIGIN: https://example.com

  deploy:
    name: Deploy (Render)
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: |
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
