# Render blueprint for the Mafia app: the backend (apps/server) and the
# Next.js frontend (apps/web), both as Docker web services.
#
# This defines the service config only. Deploys are triggered by the
# GitHub Actions workflow (.github/workflows/deploy.yml) via per-service
# Deploy Hooks after CI passes — NOT by Render's own auto-deploy-on-push,
# which is disabled below so a red build never ships.
#
# First-time setup:
#   1. Render Dashboard -> New -> Blueprint -> pick this repo. Render reads
#      this file and creates BOTH services.
#   2. Fill in the `sync: false` env vars in the dashboard:
#        mafia-server: MONGO_URI, WEB_ORIGIN
#        mafia-web:    API_ORIGIN  (https URL of the mafia-server service,
#                                   no trailing slash)
#      SESSION_SECRET / METRICS_TOKEN are generated once by Render and persist.
#   3. For EACH service: Settings -> Deploy Hook. Copy the URLs into the
#      GitHub repo secrets RENDER_DEPLOY_HOOK_URL (server) and
#      RENDER_WEB_DEPLOY_HOOK_URL (web).
#
# NOTE: API_ORIGIN is consumed at BUILD time by apps/web/next.config.mjs
# (baked into the rewrites), so changing it in the dashboard requires a
# fresh deploy, not just a restart.
services:
  - type: web
    name: mafia-server
    runtime: docker
    dockerfilePath: apps/server/Dockerfile
    # The Dockerfile's build context MUST be the repo root (npm workspaces).
    dockerContext: .
    plan: starter
    region: oregon
    branch: main
    # CI gates the deploy; don't let Render deploy on raw push.
    autoDeploy: false
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      # Exact origin of the deployed frontend, no trailing slash. CORS and
      # the cross-site session cookie both string-match this.
      - key: WEB_ORIGIN
        sync: false
      - key: MONGO_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: METRICS_TOKEN
        generateValue: true

  - type: web
    name: mafia-web
    runtime: docker
    dockerfilePath: apps/web/Dockerfile
    # Build context MUST be the repo root (npm workspaces).
    dockerContext: .
    plan: starter
    region: oregon
    branch: main
    # CI gates the deploy; don't let Render deploy on raw push.
    autoDeploy: false
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      # https origin of the mafia-server service, no trailing slash.
      # next.config.mjs bakes this into the /api and /socket.io rewrites at
      # build time so the session cookie stays first-party.
      - key: API_ORIGIN
        sync: false
