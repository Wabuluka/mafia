# Render blueprint for the Mafia app — ONE service, ONE container running
# BOTH apps (see the repo-root Dockerfile + docker-entrypoint.sh):
#
#   - apps/web (Next.js) on the public $PORT Render provides.
#   - apps/server (Express + Socket.IO) on an internal port; Next's
#     /api and /socket.io rewrites proxy to it, so the browser only ever
#     sees this one origin and the session cookie stays first-party.
#
# Deploys are triggered by the GitHub Actions workflow
# (.github/workflows/deploy.yml) via a Deploy Hook after CI passes — NOT by
# Render's own auto-deploy-on-push, disabled below so a red build never ships.
#
# First-time setup:
#   1. Render Dashboard -> New -> Blueprint -> pick this repo.
#   2. Fill in the `sync: false` env vars in the dashboard:
#        MONGO_URI    — MongoDB connection string.
#        WEB_ORIGIN   — the public https URL of THIS service, no trailing
#                       slash (CORS + the session cookie string-match it).
#      SESSION_SECRET / METRICS_TOKEN are generated once by Render and persist.
#   3. Settings -> Deploy Hook: copy the URL into the GitHub repo secret
#      RENDER_DEPLOY_HOOK_URL.
#
# API_ORIGIN is NOT set here — it's baked to http://127.0.0.1:4000 at image
# build time (Dockerfile) since it only ever points at the co-located server.
services:
  - type: web
    name: mafia
    runtime: docker
    dockerfilePath: Dockerfile
    # Build context MUST be the repo root (npm workspaces).
    dockerContext: .
    plan: starter
    region: oregon
    branch: main
    # CI gates the deploy; don't let Render deploy on raw push.
    autoDeploy: false
    # Next serves this; it 200s once both processes are up.
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      # Internal port for apps/server. Render still injects PORT for the
      # public web process; the entrypoint keeps them separate.
      - key: SERVER_PORT
        value: 4000
      # Public https origin of THIS service, no trailing slash.
      - key: WEB_ORIGIN
        sync: false
      - key: MONGO_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: METRICS_TOKEN
        generateValue: true
